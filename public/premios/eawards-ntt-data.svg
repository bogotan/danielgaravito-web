<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nttbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#003E7E"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#nttbg)"/>
  <!-- Grid de puntos -->
  <g fill="#fff" opacity="0.08">
    <circle cx="100" cy="100" r="3"/><circle cx="200" cy="100" r="3"/><circle cx="300" cy="100" r="3"/>
    <circle cx="900" cy="100" r="3"/><circle cx="1000" cy="100" r="3"/><circle cx="1100" cy="100" r="3"/>
    <circle cx="100" cy="700" r="3"/><circle cx="200" cy="700" r="3"/><circle cx="300" cy="700" r="3"/>
    <circle cx="900" cy="700" r="3"/><circle cx="1000" cy="700" r="3"/><circle cx="1100" cy="700" r="3"/>
  </g>
  <!-- NTT DATA logo style -->
  <text x="100" y="180" fill="#fff" font-family="Arial Black, sans-serif" font-size="56" font-weight="900">NTT DATA</text>
  <line x1="100" y1="210" x2="350" y2="210" stroke="#00A0E9" stroke-width="4"/>
  <text x="100" y="260" fill="#00A0E9" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">FOUNDATION</text>
  <!-- Trofeo -->
  <g transform="translate(600 420)">
    <circle r="160" fill="#fff" opacity="0.08"/>
    <text x="0" y="50" text-anchor="middle" font-size="220">🏆</text>
  </g>
  <!-- Título -->
  <text x="600" y="680" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="52" font-weight="bold">Finalista eAwards 2023</text>
  <text x="600" y="730" text-anchor="middle" fill="#00A0E9" font-family="Arial, sans-serif" font-size="26" letter-spacing="3">NTT DATA FOUNDATION</text>
</svg>
