<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eybg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <radialGradient id="eyglow" cx="0.3" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#eybg)"/>
  <rect width="1200" height="800" fill="url(#eyglow)"/>
  <!-- Letras EY gigantes iluminadas estilo letterbox -->
  <g transform="translate(120 240)">
    <rect x="0" y="0" width="180" height="320" rx="8" fill="#FFE600" stroke="#000" stroke-width="6"/>
    <text x="90" y="220" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="220" font-weight="900" fill="#000">E</text>
    <rect x="220" y="0" width="180" height="320" rx="8" fill="#FFE600" stroke="#000" stroke-width="6"/>
    <text x="310" y="220" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="220" font-weight="900" fill="#000">Y</text>
  </g>
  <!-- Trofeo a la derecha -->
  <g transform="translate(820 320)">
    <text x="0" y="0" text-anchor="middle" font-size="200">🏆</text>
  </g>
  <!-- Título -->
  <text x="600" y="640" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="54" font-weight="bold">Emprendedor Social del Año</text>
  <text x="600" y="700" text-anchor="middle" fill="#FFE600" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">EY COLOMBIA · 2023</text>
</svg>
