<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fwbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="fwwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#b4242f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#fwbg)"/>
  <!-- Muros cayendo -->
  <g opacity="0.15">
    <rect x="40" y="300" width="80" height="500" fill="#fff" transform="rotate(-8 80 550)"/>
    <rect x="160" y="260" width="80" height="540" fill="#fff" transform="rotate(-4 200 530)"/>
    <rect x="280" y="240" width="80" height="560" fill="#fff"/>
    <rect x="840" y="240" width="80" height="560" fill="#fff"/>
    <rect x="960" y="260" width="80" height="540" fill="#fff" transform="rotate(4 1000 530)"/>
    <rect x="1080" y="300" width="80" height="500" fill="#fff" transform="rotate(8 1120 550)"/>
  </g>
  <!-- Trofeo centro -->
  <g transform="translate(600 380)">
    <circle r="140" fill="url(#fwwall)" opacity="0.18"/>
    <text x="0" y="30" text-anchor="middle" font-size="180" fill="#fff">🏆</text>
  </g>
  <!-- Título -->
  <text x="600" y="620" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="58" font-weight="bold">1er Lugar · Falling Walls Lab</text>
  <text x="600" y="680" text-anchor="middle" fill="#E63946" font-family="Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="4">COLOMBIA · PERU · VENEZUELA · ECUADOR</text>
  <text x="600" y="730" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="26" letter-spacing="2">Falling Walls Foundation · 2021</text>
</svg>
