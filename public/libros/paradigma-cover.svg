<svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0d4f3c"/>
    </linearGradient>
    <linearGradient id="title2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1100" fill="url(#bg2)"/>
  <!-- De opacidad a transparencia: degrado en barras -->
  <g>
    <rect x="100" y="380" width="600" height="14" fill="#1e293b" rx="2"/>
    <rect x="100" y="410" width="600" height="14" fill="#334155" rx="2"/>
    <rect x="100" y="440" width="600" height="14" fill="#475569" rx="2" opacity="0.85"/>
    <rect x="100" y="470" width="600" height="14" fill="#64748b" rx="2" opacity="0.75"/>
    <rect x="100" y="500" width="600" height="14" fill="#3B82F6" rx="2" opacity="0.65"/>
    <rect x="100" y="530" width="600" height="14" fill="#60A5FA" rx="2" opacity="0.55"/>
    <rect x="100" y="560" width="600" height="14" fill="#10B981" rx="2" opacity="0.45"/>
  </g>
  <!-- Símbolo central -->
  <text x="400" y="320" text-anchor="middle" font-size="120" opacity="0.85">🔍</text>
  <!-- Título -->
  <text x="400" y="730" text-anchor="middle" fill="url(#title2)" font-family="Georgia, serif" font-size="58" font-weight="bold">De la Opacidad</text>
  <text x="400" y="800" text-anchor="middle" fill="url(#title2)" font-family="Georgia, serif" font-size="58" font-weight="bold">a la Transparencia</text>
  <!-- Separador -->
  <line x1="240" y1="850" x2="560" y2="850" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <!-- Subtítulo -->
  <text x="400" y="900" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" opacity="0.85">El Camino del Pagador Inteligente</text>
  <!-- Frase ancla -->
  <text x="400" y="965" text-anchor="middle" fill="#10B981" font-family="Georgia, serif" font-style="italic" font-size="20" opacity="0.85">"Sin eficiencia, no hay suficiencia"</text>
  <!-- Autor -->
  <text x="400" y="1050" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="3">DANIEL GARAVITO</text>
</svg>